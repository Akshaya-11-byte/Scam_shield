<!DOCTYPE html>

<html>
<head>
    <title>ScamShield</title>
</head>

<body>

```
<h1>🛡️ ScamShield</h1>

<p>Protect yourself from online scams.</p>

<hr>

<h2>Check for a Scam</h2>

<p>
    Paste a suspicious message, email, or job offer below.
    ScamShield will analyze it for possible warning signs.
</p>

<form method="POST">
    {% csrf_token %}

    <textarea
        name="message"
        rows="10"
        cols="70"
        placeholder="Paste your suspicious content here..."
        required></textarea>

    <br><br>

    <button type="submit">🔍 Analyze</button>
</form>
```

</body>
</html>
